limit_req_zone $binary_remote_addr zone=aurum_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.aurumpos.net;

    return 308 https://api.aurumpos.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.aurumpos.net;

    ssl_certificate /etc/letsencrypt/live/api.aurumpos.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aurumpos.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AurumTLS:10m;
    ssl_session_tickets off;

    client_max_body_size 10m;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ ^/api/v1/auth/(register|verify-email|login|refresh|verification/resend|forgot-password|reset-password|google|invitations/accept|account-deletion/) {
        limit_req zone=aurum_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
