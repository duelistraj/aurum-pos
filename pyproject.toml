[project]
name = "aurum-pos"
version = "0.0.2"
description = "Open-source POS and inventory system for jewellery shops"
authors = [{ name = "zephyr" }]
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "argon2-cffi>=25.1,<26",
    "asyncpg>=0.29,<0.30",
    "boto3>=1.40,<2",
    "cryptography>=45,<47",
    "fastapi>=0.111,<0.112",
    "google-auth[requests]>=2.40,<3",
    "httpx>=0.27,<1",
    "openpyxl>=3.1.5,<4",
    "passlib[argon2]>=1.7.4,<2",
    "pillow>=12,<13",
    "pydantic-settings>=2.3,<3",
    "pyjwt>=2.13,<3",
    "python-barcode>=0.16.1,<0.17",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.32,<0.0.33",
    "reportlab>=4.4.6,<5",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.30,<0.31",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<7",
    "ruff>=0.4,<1",
]

[tool.uv]
package = false
required-version = "==0.11.28"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a migrated PostgreSQL database"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "openpyxl.*", "passlib.*", "reportlab.*"]
ignore_missing_imports = true
