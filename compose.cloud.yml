services:
  api:
    image: ${AURUM_IMAGE:?Set AURUM_IMAGE to a ghcr.io digest}
    env_file:
      - .env
    environment:
      ENV: production
      DEPLOYMENT_MODE: hosted
      MIGRATION_DATABASE_URL: ""
      FORWARDED_ALLOW_IPS: "172.30.0.1"
      AURUM_IMAGE_DIGEST: ${AURUM_IMAGE:?Set AURUM_IMAGE to a ghcr.io digest}
      GIT_SHA: ${AURUM_GIT_SHA:?Set AURUM_GIT_SHA}
      AURUM_CONFIG_REVISION: ${AURUM_CONFIG_REVISION:?Set AURUM_CONFIG_REVISION}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?Set AWS_REGION}
        awslogs-group: /aurum-pos/api
        awslogs-stream: ${AURUM_GIT_SHA:?Set AURUM_GIT_SHA}
        awslogs-create-group: "true"

  worker:
    image: ${AURUM_IMAGE:?Set AURUM_IMAGE to a ghcr.io digest}
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      ENV: production
      DEPLOYMENT_MODE: hosted
      MIGRATION_DATABASE_URL: ""
      AURUM_IMAGE_DIGEST: ${AURUM_IMAGE:?Set AURUM_IMAGE to a ghcr.io digest}
      GIT_SHA: ${AURUM_GIT_SHA:?Set AURUM_GIT_SHA}
      AURUM_CONFIG_REVISION: ${AURUM_CONFIG_REVISION:?Set AURUM_CONFIG_REVISION}
      WORKER_INSTANCE_ID: ${AURUM_WORKER_INSTANCE_ID:?Set AURUM_WORKER_INSTANCE_ID}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://api:8000/health/worker"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?Set AWS_REGION}
        awslogs-group: /aurum-pos/worker
        awslogs-stream: ${AURUM_WORKER_INSTANCE_ID:?Set AURUM_WORKER_INSTANCE_ID}
        awslogs-create-group: "true"

  migrate:
    image: ${AURUM_IMAGE:?Set AURUM_IMAGE to a ghcr.io digest}
    command: ["alembic", "upgrade", "head"]
    profiles: ["operator"]
    env_file:
      - .env
    environment:
      ENV: production
      DEPLOYMENT_MODE: hosted
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL}
      AURUM_IMAGE_DIGEST: ${AURUM_IMAGE:?Set AURUM_IMAGE to a ghcr.io digest}
      GIT_SHA: ${AURUM_GIT_SHA:?Set AURUM_GIT_SHA}
      AURUM_CONFIG_REVISION: ${AURUM_CONFIG_REVISION:?Set AURUM_CONFIG_REVISION}
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
