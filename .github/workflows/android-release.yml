name: Release Android to Play Testing

run-name: Play Internal and Closed Testing from ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA that already passed CI
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: aurum-pos-play-testing
  cancel-in-progress: false

jobs:
  release-aab:
    runs-on: ubuntu-latest
    environment: play-internal
    env:
      AURUM_DISTRIBUTION: cloud
      VITE_DISTRIBUTION: cloud
      VITE_GOOGLE_AUTH_ENABLED: "true"
      ANDROID_APPLICATION_ID: com.duelistraj.aurumpos
      CAPACITOR_APP_ID: com.duelistraj.aurumpos
      WEB_COMMIT_SHA: ${{ inputs.ref }}

    steps:
      - name: Require Android release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -Eeuo pipefail
          missing=()
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)
          [[ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]] || missing+=(PLAY_SERVICE_ACCOUNT_JSON)
          if (( ${#missing[@]} )); then
            printf '::error::Missing required Android release secret: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Verify immutable tested revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::ref must be a full 40-character commit SHA"
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_REF" ]] || {
            echo "::error::Checked-out revision does not match requested SHA"
            exit 1
          }
          git merge-base --is-ancestor "$RELEASE_REF" origin/main || {
            echo "::error::The requested revision is not reachable from main"
            exit 1
          }
          SUCCESSFUL_RUNS="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow CI \
              --commit "$RELEASE_REF" \
              --status success \
              --json databaseId \
              --jq length
          )"
          [[ "$SUCCESSFUL_RUNS" -gt 0 ]] || {
            echo "::error::The requested revision has no successful CI run"
            exit 1
          }

      - name: Set Android version code
        run: |
          echo \
            "ANDROID_VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" \
            >>"$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify pinned JavaScript toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web App
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Prepare Gradle wrapper
        run: chmod +x frontend/android/gradlew

      - name: Run Android Keystore instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          script: cd frontend/android && ./gradlew :app:connectedDebugAndroidTest

      - name: Decode keystore
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Test, lint, and build signed AAB
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew test lint bundleRelease \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Remove temporary keystore
        if: always()
        working-directory: frontend/android
        run: rm -f release.keystore

      - name: Record signed bundle provenance
        working-directory: frontend/android
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          AAB_SHA256="$(sha256sum app/build/outputs/bundle/release/app-release.aab | cut -d' ' -f1)"
          jq -n \
            --arg source_sha "$RELEASE_REF" \
            --arg aab_sha256 "$AAB_SHA256" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{
              schema: "aurum-pos-android-release-v1",
              source_sha: $source_sha,
              aab_sha256: $aab_sha256,
              workflow_run_id: $run_id
            }' >"$RUNNER_TEMP/android-release-metadata.json"
          printf 'Android source SHA: %s\nAAB SHA-256: %s\n' \
            "$RELEASE_REF" "$AAB_SHA256" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload Android release provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-provenance
          path: ${{ runner.temp }}/android-release-metadata.json
          if-no-files-found: error
          retention-days: 90

      - name: Release signed AAB to Play Internal Testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.duelistraj.aurumpos
          releaseFiles: frontend/android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed

      - name: Authenticate Google Play promotion
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Promote tested release to Play Closed Testing
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          PACKAGE_NAME: com.duelistraj.aurumpos
        run: |
          set -Eeuo pipefail
          API_ROOT="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits"
          EDIT_ID="$(
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $ACCESS_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{}' \
              "$API_ROOT" | jq --exit-status --raw-output '.id'
          )"
          cleanup_edit() {
            if [[ -n "${EDIT_ID:-}" ]]; then
              curl --fail --silent --show-error \
                --request DELETE \
                --header "Authorization: Bearer $ACCESS_TOKEN" \
                "$API_ROOT/$EDIT_ID" >/dev/null || true
            fi
          }
          trap cleanup_edit EXIT

          jq --null-input \
            --arg version_code "$ANDROID_VERSION_CODE" \
            --arg release_name "Aurum POS $ANDROID_VERSION_CODE" \
            '{
              track: "alpha",
              releases: [{
                name: $release_name,
                status: "completed",
                versionCodes: [$version_code]
              }]
            }' >"$RUNNER_TEMP/play-closed-track.json"

          curl --fail --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/play-closed-track.json" \
            "$API_ROOT/$EDIT_ID/tracks/alpha" \
            --output "$RUNNER_TEMP/play-closed-track-response.json"
          jq --exit-status '.track == "alpha"' \
            "$RUNNER_TEMP/play-closed-track-response.json" >/dev/null

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            "$API_ROOT/$EDIT_ID:commit" \
            --output "$RUNNER_TEMP/play-closed-commit-response.json"
          jq --exit-status '.id != null' \
            "$RUNNER_TEMP/play-closed-commit-response.json" >/dev/null
          EDIT_ID=""
          printf 'Promoted Android version code %s to Play Closed Testing (alpha).\n' \
            "$ANDROID_VERSION_CODE" >>"$GITHUB_STEP_SUMMARY"
