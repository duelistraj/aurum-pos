services:
  api:
    image: ${AURUM_IMAGE:?Set AURUM_IMAGE to a ghcr.io digest}
    env_file: .env.cloud
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  worker:
    image: ${AURUM_IMAGE:?Set AURUM_IMAGE to a ghcr.io digest}
    command: ["python", "-m", "app.worker"]
    env_file: .env.cloud
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
