services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aurum_pos
      POSTGRES_USER: aurum
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - aurum-pos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurum -d aurum_pos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  aurum-pos-postgres-data:
