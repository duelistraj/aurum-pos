name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "frontend/**"

  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "frontend/**"

  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      AURUM_DISTRIBUTION: cloud
      VITE_DISTRIBUTION: cloud
      VITE_GOOGLE_AUTH_ENABLED: "false"
      ANDROID_APPLICATION_ID: com.duelistraj.aurumpos
      CAPACITOR_APP_ID: com.duelistraj.aurumpos
      WEB_COMMIT_SHA: ${{ github.sha }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24.18.0'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Verify pinned JavaScript toolchain
      run: |
        test "$(node --version)" = "v24.18.0"
        test "$(npm --version)" = "11.16.0"

    - name: Build Web App
      working-directory: ./frontend
      run: npm run build

    - name: Sync Capacitor
      working-directory: ./frontend
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        else
          npx cap sync
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Test, lint, and build Android APK (Debug)
      working-directory: ./frontend/android
      run: |
        chmod +x gradlew
        ./gradlew test lint assembleDebug

    - name: Run Android Keystore instrumentation tests
      uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
      with:
        api-level: 35
        arch: x86_64
        target: default
        script: cd frontend/android && ./gradlew :app:connectedDebugAndroidTest

    - name: Upload APK
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: aurum-pos-cloud-smoke-debug-apk
        path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
