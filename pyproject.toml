[tool.poetry]
name = "aurum-pos"
version = "0.0.2"
description = "Open-source POS and inventory system for jewellery shops"
authors = ["zephyr"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "~3.12"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
sqlalchemy = "^2.0"
asyncpg = "^0.29"
alembic = "^1.13"
pydantic-settings = "^2.3"
python-dotenv = "^1.0"
reportlab = "^4.4.6"
python-barcode = "^0.16.1"
pillow = "^12.0.0"
openpyxl = "^3.1.5"
pyjwt = "^2.13.0"
passlib = {extras = ["argon2"], version = "^1.7.4"}
argon2-cffi = "^25.1.0"
python-multipart = "^0.0.32"
[tool.poetry.group.dev.dependencies]
black = "^24.4"
ruff = "^0.4"
mypy = "^1.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
