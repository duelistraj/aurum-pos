<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset your Aurum POS password</title>
  <style>body{font:16px system-ui;max-width:600px;margin:4rem auto;padding:0 1.25rem;color:#1e293b}a{color:#b45309}label{display:block;margin:1rem 0}input{box-sizing:border-box;width:100%;padding:.75rem;border:1px solid #cbd5e1;border-radius:.5rem}button{padding:.75rem 1rem;border:0;border-radius:.5rem;background:#b45309;color:white}.card{padding:2rem;border:1px solid #e2e8f0;border-radius:1rem}</style>
</head>
<body>
  <main class="card">
    <h1>Reset your password</h1>
    <form id="request-form"><label>Email<input name="email" type="email" required></label><button type="submit">Email reset link</button></form>
    <form id="reset-form" hidden><label>New password<input name="password" type="password" minlength="12" maxlength="256" required></label><button type="submit">Set new password</button></form>
    <p id="status" role="status"></p><p><a href="/">Aurum POS home</a></p>
  </main>
  <script>
    const api = 'https://api.aurumpos.net/api/v1/auth';
    const actionUrl = new URL(location.href);
    const token = new URLSearchParams(actionUrl.hash.slice(1)).get('token') || actionUrl.searchParams.get('token');
    if (token) {
      actionUrl.hash = '';
      actionUrl.searchParams.delete('token');
      history.replaceState(null, '', actionUrl.pathname + actionUrl.search);
    }
    const status = document.querySelector('#status');
    const requestForm = document.querySelector('#request-form');
    const resetForm = document.querySelector('#reset-form');
    if (token) { requestForm.hidden = true; resetForm.hidden = false; }
    requestForm.addEventListener('submit', async event => {
      event.preventDefault(); const values = new FormData(event.currentTarget); status.textContent = 'Submitting…';
      try { const response = await fetch(api + '/forgot-password', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:values.get('email')})}); const data = await response.json(); if (!response.ok) throw new Error('Unable to request a reset'); status.textContent = data.message; } catch (error) { status.textContent = error.message; }
    });
    resetForm.addEventListener('submit', async event => {
      event.preventDefault(); const values = new FormData(event.currentTarget); status.textContent = 'Submitting…';
      try { const response = await fetch(api + '/reset-password', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:values.get('password')})}); const data = await response.json(); if (!response.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Unable to reset password'); status.textContent = 'Password reset. You can now sign in from the Aurum POS app.'; resetForm.hidden = true; } catch (error) { status.textContent = error.message; }
    });
  </script>
</body>
</html>
