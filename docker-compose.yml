services:
  nginx:
    image: nginx:1.28-alpine
    container_name: aurum-pos-nginx

    depends_on:
      - api

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

    restart: unless-stopped

    networks:
      - backend

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  api:
    image: ghcr.io/duelistraj/aurum-pos:latest
    container_name: aurum-pos-api

    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "8000"

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - backend

networks:
  backend:
    driver: bridge
