<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#070808">
  <link rel="canonical" href="https://aurumpos.net/reset-password.html">
  <link rel="icon" href="/public-assets/aurum-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/public-assets/site.css">
  <title>Reset your password - Aurum POS</title>
  <script src="/public-assets/site.js" defer></script>
  <script src="/public-assets/actions.js" defer></script>
</head>
<body data-action-page="reset-password">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/" aria-label="Aurum POS home"><img class="brand__mark" src="/public-assets/aurum-logo.svg" alt=""><span>Aurum POS</span></a>
      <nav class="site-navigation" aria-label="Primary navigation" data-site-navigation data-open="false"><a href="/#features">Features</a><a href="/#retailers">For Retailers</a><a href="/#pricing">Pricing</a><a href="/#resources">Resources</a><a href="/#changelog">Changelog</a></nav>
      <div class="site-actions"><a class="button button--secondary" href="https://app.aurumpos.net/login">Sign in</a><a class="button button--primary" href="https://app.aurumpos.net/login?mode=register">Get Started Free</a></div>
      <button class="menu-button" type="button" aria-label="Open navigation" aria-expanded="false" data-menu-button><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </header>
  <main class="action-shell" id="main-content">
    <section class="action-card" aria-labelledby="page-title">
      <div class="action-card__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v10H6zM12 15v2"/></svg>
      </div>
      <p class="section-kicker">Account security</p>
      <h1 id="page-title">Reset your password</h1>
      <p class="action-card__lede">Request a secure reset link or choose a new password when you arrive from your email.</p>
      <form data-reset-request>
        <label class="field">Email address<input name="email" type="email" autocomplete="email" required></label>
        <button class="button button--primary button--wide" type="submit">Email reset link</button>
      </form>
      <form data-reset-password hidden>
        <label class="field">New password<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><span>Use at least 12 characters.</span></label>
        <button class="button button--primary button--wide" type="submit">Set new password</button>
      </form>
      <p class="action-status" data-action-status role="status" aria-live="polite"></p>
      <p class="action-card__footer"><a href="https://app.aurumpos.net/login">Return to sign in</a></p>
    </section>
  </main>
  <footer class="site-footer">
    <div class="site-footer__inner"><p class="site-footer__copy">© <span data-current-year>2026</span> Aurum POS</p><nav class="site-footer__links" aria-label="Legal"><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="/account-deletion.html">Account deletion</a></nav></div>
  </footer>
</body>
</html>
