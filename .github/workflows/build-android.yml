name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "frontend/**"

  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "frontend/**"

  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      AURUM_DISTRIBUTION: cloud
      VITE_DISTRIBUTION: cloud
      VITE_GOOGLE_AUTH_ENABLED: "false"
      ANDROID_APPLICATION_ID: com.duelistraj.aurumpos
      CAPACITOR_APP_ID: com.duelistraj.aurumpos

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build Web App
      working-directory: ./frontend
      run: npm run build

    - name: Sync Capacitor
      working-directory: ./frontend
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        else
          npx cap sync
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Build Android APK (Debug)
      working-directory: ./frontend/android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: aurum-pos-cloud-smoke-debug-apk
        path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
