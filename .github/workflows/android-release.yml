name: Build Signed Android AAB

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA that already passed CI
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  release-aab:
    runs-on: ubuntu-latest
    environment: play-internal
    env:
      AURUM_DISTRIBUTION: cloud
      VITE_DISTRIBUTION: cloud
      VITE_GOOGLE_AUTH_ENABLED: "true"
      ANDROID_APPLICATION_ID: com.duelistraj.aurumpos
      CAPACITOR_APP_ID: com.duelistraj.aurumpos

    steps:
      - name: Require Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          missing=()
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)
          if (( ${#missing[@]} )); then
            printf '::error::Missing required Android signing secret: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Verify immutable tested revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::ref must be a full 40-character commit SHA"
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_REF" ]] || {
            echo "::error::Checked-out revision does not match requested SHA"
            exit 1
          }
          git merge-base --is-ancestor "$RELEASE_REF" origin/main || {
            echo "::error::The requested revision is not reachable from main"
            exit 1
          }
          SUCCESSFUL_RUNS="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow CI \
              --commit "$RELEASE_REF" \
              --status success \
              --json databaseId \
              --jq length
          )"
          [[ "$SUCCESSFUL_RUNS" -gt 0 ]] || {
            echo "::error::The requested revision has no successful CI run"
            exit 1
          }

      - name: Set Android version code
        run: echo "ANDROID_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >>"$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web App
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Run Android Keystore instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: cd frontend/android && ./gradlew connectedDebugAndroidTest

      - name: Decode keystore
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Test, lint, and build signed AAB
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew test lint bundleRelease \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Record signed artifact checksum
        working-directory: frontend/android
        run: sha256sum app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aurum-pos-play-internal-aab-${{ github.run_number }}
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
