name: CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aurum_pos_test
          POSTGRES_USER: aurum
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurum -d aurum_pos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aurum:change-me@localhost:5432/aurum_pos_test
      APP_NAME: Aurum POS Test
      ENV: test
      JWT_SECRET_KEY: test-secret-key-that-is-long-enough-for-ci
      CORS_ORIGINS: '["http://localhost:5174"]'
      AWS_REGION: ap-southeast-1
      S3_INVOICE_BUCKET: aurum-pos-ci-invoices
      RUN_INTEGRATION: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Validate lockfile
        run: uv lock --check

      - name: Audit Python dependencies
        run: uv run pip-audit

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Check schema matches SQLAlchemy metadata
        run: uv run alembic check

      - name: Check changed migrations for unsafe operations
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -Eeuo pipefail
          BASE_SHA="${MIGRATION_BASE_SHA:-}"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] ||
             ! git cat-file -e "${BASE_SHA}^{commit}"; then
            BASE_SHA="${GITHUB_SHA}^"
          fi
          mapfile -t MIGRATIONS < <(
            git diff --diff-filter=ACMR --name-only \
              "$BASE_SHA" "$GITHUB_SHA" -- "alembic/versions/*.py"
          )
          uv run python scripts/check_migration_safety.py "${MIGRATIONS[@]}"

      - name: Lint backend
        run: uv run ruff check app tests scripts alembic/versions

      - name: Check backend formatting
        run: uv run ruff format --check app tests scripts alembic/versions

      - name: Type-check backend
        run: uv run mypy app

      - name: Test backend
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=55

  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://localhost:8080
      VITE_DISTRIBUTION: self_hosted
      VITE_GOOGLE_AUTH_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm run audit:production

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  publish-image:
    if: >-
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      ref: ${{ github.sha }}
